apiVersion: apps/v1
kind: Deployment
metadata:
  name: genotools-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genotools-controller
  template:
    metadata:
      labels:
        app: genotools-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: genotools-controller
      containers:
      - name: controller
        image: localhost:32000/genotools-controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: metrics
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: shared-storage
          mountPath: /shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: genotools-shared-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genotools-controller
---
apiVersion: v1
kind: Service
metadata:
  name: genotools-controller
  labels:
    app: genotools-controller
spec:
  selector:
    app: genotools-controller
  ports:
  - name: api
    port: 8080
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genotools-controller-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: genotools-controller
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60